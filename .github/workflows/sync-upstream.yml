name: Upstream check

# JSM HQ (the project this is forked from) ships often. This only REPORTS what is
# waiting upstream — it never merges and never opens a PR, so the decision to take
# an update stays with a person.
#
# Read the digest in the run summary: Actions -> Upstream check -> latest run.
# To take the update: run `node scripts/sync-upstream.mjs` on your machine (or ask
# your agent to), which merges in a throwaway worktree and opens a PR for review.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: git remote add upstream https://github.com/jsmastery-pro/jsm-hq.git

      - name: What is waiting upstream (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## What is waiting upstream"
            echo ""
            node scripts/sync-upstream.mjs --digest
            echo ""
            echo "_To take it: \`node scripts/sync-upstream.mjs\` on the machine with the repo (or ask your agent to run it)._"
          } | tee -a "$GITHUB_STEP_SUMMARY"
